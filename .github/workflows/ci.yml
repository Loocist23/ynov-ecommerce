name: CI

# Déclencheurs : sur chaque push et pull_request
on:
  push:
    branches: [ main, features/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Tests & Lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
      # 1. Checkout le code
      - uses: actions/checkout@v4

      # 2. Installer Node.js
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # 3. Installer les dépendances
      - name: Install dependencies
        run: npm ci

      # 4. Exécuter le lint
      - name: Lint
        run: npm run lint

      # 5. Exécuter tous les tests (unitaires + intégration)
      - name: Run tests
        run: npm test -- --bail
